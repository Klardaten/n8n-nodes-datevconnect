name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build npm packages
        run: npm run build:packages

      - name: Check npm tarballs
        run: npm run test:packages

      - name: Test packaged nodes in n8n
        run: |
          npm_config_cache="$(npm config get cache)"
          export npm_config_cache
          node tests/e2e/n8n/run-package-e2e.mjs
